name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm.cmd ci
      - name: Check source and run tests
        run: |
          npm.cmd run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify the unpacked Windows app
        run: npm.cmd run package:win:dir
      - name: Smoke-test the packaged Windows app
        run: npm.cmd run smoke:windows
      - name: Build installer and portable executable
        id: package
        run: |
          npx.cmd electron-builder --config electron-builder.config.cjs --win --x64 --prepackaged dist/win-unpacked --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run verify:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Smoke-test the portable executable
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-windows.cjs "dist/Desktop-Anime-Bot-Portable-$version-x64.exe" portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/Desktop-Anime-Bot-Setup-*-x64.exe
            dist/Desktop-Anime-Bot-Portable-*-x64.exe
            dist/SHA256SUMS.txt
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Save startup smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-reports
          path: dist/smoke/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: downloads
      - name: Verify downloaded package checksums
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish Windows test build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          ## Windows x64 test build

          Download **Desktop-Anime-Bot-Setup-…-x64.exe** for a per-user installation with Start menu and desktop shortcuts. Download **Desktop-Anime-Bot-Portable-…-x64.exe** to launch without installing.

          Both packages include Electron, the default 3D character, and the compiled Windows window helper. Users do not need Node.js, npm, or PowerShell setup. AI API keys or a separately configured local model server are still needed for conversation.

          Version 0.2.0 adds microphone recordings that become editable chat drafts, encrypted conversation memory across restarts, and local-model loading stages with an animated progress bar. Open **Voice & memory** to configure a local Whisper.cpp server or speech API. Speech models and server software are configured separately. Microphone input starts disabled, recordings are limited to 60 seconds, and transcripts are never sent automatically.

          Conversation memory starts enabled and is kept separately for each AI profile. Use **Clear chat**, **Clear all memory**, or the memory switch to erase saved conversations. Local-model load progress is indeterminate when the server supplies no percentage.

          These test executables are **unsigned**. Windows may identify the publisher as unknown. No signing certificate or automatic updater is included.

          The build passed source checks, automated tests, packaged-module and native-helper checks, and an automated Electron startup/rendering smoke check on a Windows runner. This does not replace testing interaction, model APIs, audio, capture, and display scaling on a tester's own PC.

          The app starts paused. Use **Resume companion** after reviewing its settings. Installer and portable versions use the same Windows user settings directory; closing Settings hides it to the tray, and **Quit** exits it.
          NOTES
          printf '\nSource commit: https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
          gh release create "$tag" downloads/*.exe downloads/SHA256SUMS.txt downloads/package-verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Desktop Anime Bot ${RELEASE_VERSION} — Windows test build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --prerelease --latest=false
